services:
  - type: web
    name: diwali-sky
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
